<!DOCTYPE html>
<html>
<head>
  <title>Smart Finance AI</title>

  <style>
    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .chat-container{
      width:400px;
      background:#1e293b;
      border-radius:12px;
      padding:20px;
    }

    .messages{
      height:400px;
      overflow-y:auto;
      margin-bottom:15px;
    }

    .message{
      background:#334155;
      padding:10px;
      border-radius:10px;
      margin-bottom:10px;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
    }

    button{
      width:100%;
      margin-top:10px;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="chat-container">

  <h2>Smart Finance AI</h2>

  <div class="messages" id="messages"></div>

  <input
    type="text"
    id="input"
    placeholder="Ketik pesan..."
  >

  <button onclick="sendMessage()">
    Kirim
  </button>

</div>

<script>

async function sendMessage(){

  const input = document.getElementById("input");

  const text = input.value;

  const messages =
    document.getElementById("messages");

  messages.innerHTML += `
    <div class="message">
      Kamu: ${text}
    </div>
  `;

  const response = await fetch(
    "https://ai-smartfinance-chatbot-production.up.railway.app/chat",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:text
      })
    }
  );

  const data = await response.json();

  messages.innerHTML += `
    <div class="message">
      Bot: ${data.answer}
    </div>
  `;

  input.value = "";
}

</script>

</body>
</html>
